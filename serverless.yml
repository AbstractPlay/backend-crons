service: abstract-play-backend-crons

frameworkVersion: "3"

custom:
  scheduleEnabled:
    prod: true
    dev: false
  recbucket:
    prod: "records.abstractplay.com"
    dev: "records.abstractplay.com"
  dumpbucket: "abstractplay-db-dump"
  opsbucket: "private-ops-153672715141-us-east-1-an"
  esbuild:
    tsconfig: "./tsconfig.json"
    bundle: true
    sourcemap: false # Sourcemaps are large and not needed in production
    format: "esm"
    outExtension:
      ".js": ".mjs"
    platform: "node"
    target: "node20"
    external:
      - "@abstractplay/gameslib"
      - "@abstractplay/recranks"
      - "@aws-sdk/*"
      - "@smithy/*"
      - "buffer"
      - "fs"
    exclude:
      - "@abstractplay/gameslib"
      - "@abstractplay/recranks"
  scriptable:
    hooks:
      before:package:createDeploymentArtifacts: npm run build:layers

params:
  dev:
    profile: AbstractPlayDev
  prod:
    profile: AbstractPlayProd

plugins:
  - serverless-esbuild
  - serverless-scriptable-plugin

provider:
  name: aws
  runtime: nodejs20.x
  versionFunctions: false
  stage: ${opt:stage, "dev"}
  profile: ${param:profile}
  region: us-east-1
  memorySize: 1024
  logs:
    retentionInDays: 30   # set to any valid retention period (1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653)
  environment:
    ABSTRACT_PLAY_TABLE: abstract-play-${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:ExportTableToPointInTime
            - dynamodb:BatchWriteItem
            - sqs:SendMessage
            - sqs:SendMessageBatch
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "s3:ListBucket"
          Resource:
            - "arn:aws:s3:::abstractplay-db-dump"
            - "arn:aws:s3:::records.abstractplay.com"
            - "arn:aws:s3:::${self:custom.opsbucket}"
        - Effect: "Allow"
          Action:
            - "s3:GetObject"
          Resource:
            - "arn:aws:s3:::abstractplay-db-dump/*"
            - "arn:aws:s3:::records.abstractplay.com/*"
        - Effect: "Allow"
          Action:
            - "s3:GetObject"
          Resource:
            - "arn:aws:s3:::${self:custom.opsbucket}/*"
        - Effect: "Allow"
          Action:
            - "s3:PutObject"
            - "s3:DeleteObject"
          Resource:
            - "arn:aws:s3:::records.abstractplay.com/*"
            - "arn:aws:s3:::thumbnails.abstractplay.com/*"
            - "arn:aws:s3:::abstractplay-db-dump/*"
            - "arn:aws:s3:::${self:custom.opsbucket}/*"

functions:
  dumpdb:
    handler: src/functions/dumpdb.handler
    description: Triggers a full export of production DB to S3
    logRetentionInDays: 30
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-dumpdb
          description: Triggers a full export of production DB to S3
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # midnight UTC daily
          schedule: cron(0 0 * * ? *)

  records:
    handler: src/functions/records.handler
    description: Generates static lists of game records
    timeout: 900
    memorySize: 10240
    logRetentionInDays: 30
    layers:
      - !Ref AbstractplayGameslibLambdaLayer
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-records
          description: Generates static lists of game records
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 3am UTC daily (uses latest completed dump by LastModified)
          schedule: cron(0 3 * * ? *)

  records-ttm:
    handler: src/functions/records-ttm.handler
    description: Generates static time-to-move results of each game
    timeout: 900
    memorySize: 10240
    logRetentionInDays: 30
    layers:
      - !Ref AbstractplayGameslibLambdaLayer
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-records-ttm
          description: Generates static time-to-move results of each game
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 3am UTC daily (uses latest completed dump by LastModified)
          schedule: cron(0 3 * * ? *)

  records-move-times:
    handler: src/functions/records-move-times.handler
    description: Generates list of moves made in past 180 days
    timeout: 900
    memorySize: 10240
    logRetentionInDays: 30
    layers:
      - !Ref AbstractplayGameslibLambdaLayer
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-records-move-times
          description: Generates list of moves made in past 180 days
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 3am UTC daily (uses latest completed dump by LastModified)
          schedule: cron(0 3 * * ? *)

  records-cooccur:
    handler: src/functions/records-cooccur.handler
    description: Builds PMI game co-occurrence matrix for recommendations
    timeout: 900
    memorySize: 10240
    logRetentionInDays: 30
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-records-cooccur
          description: Builds PMI game co-occurrence matrix for recommendations
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 3am UTC daily (uses latest completed dump by LastModified)
          schedule: cron(0 3 * * ? *)

  records-rec-analytics:
    handler: src/functions/records-rec-analytics.handler
    description: Aggregates recommendation impression events to private ops S3
    timeout: 900
    memorySize: 1024
    logRetentionInDays: 30
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-records-rec-analytics
          description: Nightly recommendation impression funnel analytics
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 3am UTC daily (live DynamoDB scan of RECOMMENDS# events)
          schedule: cron(0 3 * * ? *)

  layout-feedback-analytics:
    handler: src/functions/records-layout-feedback-analytics.handler
    description: Aggregates Game Move beta layout feedback events to private ops S3
    timeout: 900
    memorySize: 1024
    logRetentionInDays: 30
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-layout-feedback-analytics
          description: Nightly Game Move layout feedback analytics
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 3am UTC daily (live DynamoDB scan of LAYOUTFB# events)
          schedule: cron(0 3 * * ? *)

  records-manifest:
    handler: src/functions/records-manifest.handler
    description: Generates manifest file for records bucket
    timeout: 900
    memorySize: 10240
    logRetentionInDays: 30
    layers:
      - !Ref AbstractplayGameslibLambdaLayer
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-records-manifest-early
          description: Manifest after records batch outputs
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 4am UTC daily
          schedule: cron(0 4 * * ? *)
      - eventBridge:
          name: abstractplay-${self:provider.stage}-records-manifest-late
          description: Manifest after summarize and player-summary fan-out
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 7:30am UTC daily (summarize 6:00, fan-out 6:15, workers finish before this)
          schedule: cron(30 7 * * ? *)

  summarize:
    handler: src/functions/summarize.handler
    description: Summarize generated game reports
    timeout: 900
    layers:
      - !Ref AbstractplayGameslibLambdaLayer
    logRetentionInDays: 30
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-summarize
          description: Summarize generated game reports
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 6am UTC daily (giving plenty of time for the record generation to complete)
          schedule: cron(0 6 * * ? *)

  player-summary-fanout:
    handler: src/functions/player-summary-fanout.handler
    description: Enqueues per-player summary slice writes after summarize
    timeout: 300
    memorySize: 1024
    logRetentionInDays: 30
    environment:
      PLAYER_SUMMARY_QUEUE_URL: !Ref PlayerSummaryQueue
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-player-summary-fanout
          description: Fan out player summary slice writes via SQS
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 6:15am UTC daily (after summarize at 6:00)
          schedule: cron(15 6 * * ? *)

  player-summary-worker:
    handler: src/functions/player-summary-worker.handler
    description: Writes one player summary slice per SQS message
    timeout: 30
    memorySize: 256
    reservedConcurrency: 25
    logRetentionInDays: 30
    events:
      - sqs:
          arn: !GetAtt PlayerSummaryQueue.Arn
          batchSize: 5
          maximumBatchingWindow: 5

  tournament-data:
    handler: src/functions/tournament-data.handler
    description: Summarizes tournament data
    timeout: 900
    memorySize: 10240
    logRetentionInDays: 30
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-tournament-data
          description: Summarizes tournament data
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 3am UTC daily (uses latest completed dump by LastModified)
          schedule: cron(0 3 * * ? *)

  starttournaments:
    handler: src/functions/starttournaments.handler
    description: Checks if any tournaments are ready to start (and starts or cancels them)
    timeout: 600
    logRetentionInDays: 30
    layers:
      - !Ref AbstractplayGameslibLambdaLayer
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-starttournaments
          description: Checks if any tournaments are ready to start (and starts or cancels them)
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # 10am and 10pm UTC every day
          schedule: cron(0 10,22 * * ? *)

  standingchallenges:
    handler: src/functions/standingchallenges.handler
    description: Manages preset standing challenge requests
    timeout: 600
    logRetentionInDays: 30
    events:
      - eventBridge:
          name: abstractplay-${self:provider.stage}-standingchallenges
          description: Manages preset standing challenge requests
          enabled: ${self:custom.scheduleEnabled.${self:provider.stage}}
          # Midnight and noon UTC every day
          schedule: cron(0 0,12 * * ? *)

resources:
  Resources:
    PlayerSummaryDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600

    PlayerSummaryQueue:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PlayerSummaryDeadLetterQueue.Arn
          maxReceiveCount: 3

layers:
  abstractplayGameslib:
    path: .serverless/layers/abstractplay-gameslib
    name: abstractplay-gameslib-${sls:stage}
    description: "Layer for @abstractplay/gameslib"
    compatibleRuntimes:
      - nodejs20.x
    retain: false
